
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website | Login</title>

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --blue: #2b4eff;
    --ink: #0e1233;
    --sun: #ffc83d;
    --bg: #f6f7fb;
    --mut: #5d6385;
    --line: #e3e6f2;
}

body {
    font-family: 'Figtree', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

nav {
    padding: 22px 8%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: 'Bricolage Grotesque', sans-serif;
    font-size: 25px;
    font-weight: 800;
}

.logo-icon {
    width: 38px;
    height: 38px;
    background: var(--blue);
    color: var(--sun);
    display: grid;
    place-items: center;
    border-radius: 10px;
    transform: rotate(-8deg);
}

.logo-icon span {
    transform: rotate(8deg);
}

.home-link {
    text-decoration: none;
    color: var(--mut);
    font-weight: 600;
}

main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 20px;
}

.login-card {
    background: white;
    width: 100%;
    max-width: 440px;
    padding: 42px;
    border: 1px solid var(--line);
    border-radius: 22px;
    box-shadow: 0 15px 45px rgba(14,18,51,0.06);
}

.tag {
    display: inline-block;
    background: #eef1ff;
    color: var(--blue);
    padding: 7px 13px;
    border-radius: 30px;
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 18px;
}

h1 {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-size: 34px;
    margin-bottom: 10px;
}

.subtitle {
    color: var(--mut);
    margin-bottom: 30px;
    line-height: 1.6;
}

.form-group {
    margin-bottom: 20px;
}

label {
    display: block;
    font-weight: 700;
    font-size: 14px;
    margin-bottom: 9px;
}

input {
    width: 100%;
    padding: 14px 15px;
    border: 1px solid var(--line);
    border-radius: 11px;
    outline: none;
    font-size: 15px;
    font-family: inherit;
    transition: 0.2s;
}

input:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(43,78,255,0.1);
}

.password-box {
    position: relative;
}

.password-box input {
    padding-right: 65px;
}

.show-btn {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: none;
    color: var(--blue);
    cursor: pointer;
    font-weight: 700;
}

.remember {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 13px;
    color: var(--mut);
    margin: 5px 0 23px;
}

.remember input {
    width: auto;
    accent-color: var(--blue);
}

.login-btn {
    width: 100%;
    padding: 15px;
    border: none;
    background: var(--blue);
    color: white;
    font-size: 16px;
    font-weight: 700;
    border-radius: 11px;
    cursor: pointer;
    transition: 0.25s;
}

.login-btn:hover {
    background: #1839e6;
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(43,78,255,0.2);
}

.bottom-text {
    text-align: center;
    margin-top: 25px;
    color: var(--mut);
    font-size: 14px;
}

.bottom-text a {
    color: var(--blue);
    font-weight: 700;
    text-decoration: none;
}

.message {
    display: none;
    margin-top: 15px;
    padding: 12px;
    background: #eef1ff;
    color: var(--blue);
    border-radius: 9px;
    font-size: 14px;
    text-align: center;
}

footer {
    text-align: center;
    padding: 20px;
    color: var(--mut);
    font-size: 13px;
}

@media(max-width: 500px) {
    .login-card {
        padding: 28px 22px;
    }

    h1 {
        font-size: 29px;
    }
}
</style>
</head>

<body>

<nav>
    <div class="logo">
        <div class="logo-icon"><span>S</span></div>
        ShopHub
    </div>

    <a href="index.html" class="home-link">← Back to Home</a>
</nav>

<main>
    <div class="login-card">

        <span class="tag">WELCOME BACK</span>

        <h1>Login to ShopHub</h1>

        <p class="subtitle">
            Welcome back! Enter your details to access your account.
        </p>

        <form id="loginForm">

            <div class="form-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Enter your username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <div class="password-box">
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                    <button
                        type="button"
                        class="show-btn"
                        onclick="togglePassword()"
                    >Show</button>
                </div>
            </div>

            <label class="remember">
                <input type="checkbox">
                Remember me
            </label>

            <button type="submit" class="login-btn">
                Login to Account →
            </button>

            <div class="message" id="message"></div>

        </form>

        <p class="bottom-text">
            Don't have an account?
            <a href="#">Create Account</a>
        </p>

    </div>
</main>

<footer>
    © 2026 ShopHub. All rights reserved.
</footer>

<script>
function togglePassword() {
    const password = document.getElementById("password");
    const button = document.querySelector(".show-btn");

    if (password.type === "password") {
        password.type = "text";
        button.textContent = "Hide";
    } else {
        password.type = "password";
        button.textContent = "Show";
    }
}

document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const message = document.getElementById("message");

    message.style.display = "block";
    message.textContent = "Demo login form submitted successfully!";
});
</script>

</body>
</html>



<script>
function togglePassword() {
    const password = document.getElementById("password");
    const button = document.querySelector(".show-btn");

    if (password.type === "password") {
        password.type = "text";
        button.textContent = "Hide";
    } else {
        password.type = "password";
        button.textContent = "Show";
    }
}

document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault();
    window.location.href = "index.html";
});
</script>
